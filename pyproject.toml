[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmeter"
version = "0.1.0"
description = "Quality-efficiency benchmarking and trajectory-guided description optimization for model-harness pairs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
opt = ["gepa==0.1.1", "litellm==1.91.0"]

[project.scripts]
agentmeter = "agentmeter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/agentmeter/**/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
