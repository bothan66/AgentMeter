[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmeter"
version = "0.1.0"
description = "Task-description optimization across language models and agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
opt = ["gepa", "litellm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
