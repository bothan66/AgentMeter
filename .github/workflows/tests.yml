name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: integrations/cliproxyapi/source/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: mkdir -p build/cliproxyapi
      - run: go -C integrations/cliproxyapi/source build -mod=readonly -o ../../../build/cliproxyapi/cli-proxy-api ./cmd/server
      - run: go -C integrations/cliproxyapi/source test -mod=readonly ./internal/runtime/executor/helps ./internal/translator/openai/openai/responses ./internal/config
      - run: python tests/check_proxy_routes.py --binary build/cliproxyapi/cli-proxy-api
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python tests/check_public_release.py
      - run: python scripts/check_no_secrets.py
      - run: pytest -q
      - run: python scripts/reproduce_artifact_table.py
      - run: python scripts/reproduce_paper_tables.py
      - run: bash -n scripts/setup_agentmeter_runtime.sh scripts/run_agentmeter_comparison.sh scripts/run_agentmeter_suite.sh
      - run: bash scripts/setup_agentmeter_runtime.sh --help
      - name: Verify wheel installation independently of the source tree
        shell: bash
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/agentmeter-wheel"
          "$RUNNER_TEMP/agentmeter-wheel/bin/python" -m pip install dist/agentmeter-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agentmeter-wheel/bin/python" -c 'from agentmeter.metrics.paper import paper_ams; print("Installed AMS module OK")'
