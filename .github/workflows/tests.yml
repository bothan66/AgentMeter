name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: integrations/cliproxyapi/source/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: mkdir -p build/cliproxyapi
      - run: go -C integrations/cliproxyapi/source build -mod=readonly -o ../../../build/cliproxyapi/cli-proxy-api ./cmd/server
      - run: go -C integrations/cliproxyapi/source test -mod=readonly ./internal/runtime/executor/helps ./internal/translator/openai/openai/responses ./internal/config
      - run: python tests/check_proxy_routes.py --binary build/cliproxyapi/cli-proxy-api
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/agentmeter tests
      - run: ruff format --check src/agentmeter tests
      - run: python tests/check_public_release.py
      - run: pytest -q
      - run: agentmeter tables
      - run: agentmeter tables --descriptive
      - run: agentmeter setup --help
      - name: Verify wheel installation independently of the source tree
        shell: bash
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/agentmeter-wheel"
          "$RUNNER_TEMP/agentmeter-wheel/bin/python" -m pip install dist/agentmeter-*.whl
          export AGENTMETER_REPO_ROOT="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agentmeter-wheel/bin/python" -m agentmeter --help
          "$RUNNER_TEMP/agentmeter-wheel/bin/python" -m agentmeter optimize --help
          "$RUNNER_TEMP/agentmeter-wheel/bin/python" -m agentmeter score --help
          "$RUNNER_TEMP/agentmeter-wheel/bin/python" -m agentmeter tables
